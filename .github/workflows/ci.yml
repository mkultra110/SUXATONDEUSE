name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci_jwt_secret_at_least_32_chars_padding_xxxxxxxxxxxxxx
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_chars_padding_xxxxxx
      SAVE_HMAC_SECRET: ci_hmac_secret_minimum_64_chars_for_anti_cheat_signature_xxxxxxxxxxxxxxx
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Build shared package
        run: npm run build --workspace=@robomow/shared

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Backend coverage (seuils GDD)
        run: npm run test:coverage --workspace=@robomow/backend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared
        run: npm run build --workspace=@robomow/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Build backend
        run: npm run build --workspace=@robomow/backend

      - name: Build frontend
        run: npm run build --workspace=@robomow/frontend
        env:
          VITE_API_URL: /api
